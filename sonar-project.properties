# ตั้งค่าการตรวจคุณภาพโค้ดด้วย SonarQube (วิธีใช้ดู sonar/README.md)
sonar.projectKey=pos-stock-moo-kratha
sonar.projectName=POS & Stock - บ้านน้องโฟค หมูกระทะ
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# โค้ดที่ตรวจ: backend (Node.js / Express) + frontend (React)
sonar.sources=backend/src,backend/scripts,backend/db,frontend/src,frontend/index.html
sonar.tests=backend/tests

# ไม่ต้องตรวจ: ไลบรารี ผลลัพธ์ build รูปภาพ ไฟล์สำรอง
sonar.exclusions=**/node_modules/**,**/dist/**,**/media/**,**/backups/**,**/*.png,**/*.jpg

# coverage: ผลจาก npm run test:coverage (backend รันชุดทดสอบ API 167+ รายการ ภายใต้ c8)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# ไม่นับ coverage (ยังตรวจบั๊ก/ช่องโหว่ตามปกติ):
#   frontend/**         หน้าเว็บยังไม่มีชุดทดสอบอัตโนมัติ — ตรวจด้วยการเปิดหน้าจริงทุกครั้งที่แก้
#   backend/scripts/**  สคริปต์ดูแลระบบที่รันด้วยมือ (สร้างฐานข้อมูล สำรอง คืนค่า ข้อมูลสาธิต) ไม่ได้เป็นส่วนของ API
sonar.coverage.exclusions=frontend/**,backend/scripts/**

# token / ที่อยู่ server ไม่เขียนไว้ที่นี่ (ไฟล์นี้ขึ้น GitHub) — ส่งผ่านตัวแปร SONAR_TOKEN / SONAR_HOST_URL ตอนรัน

# ---------------------------------------------------------------------------
# ข้ามการเตือนที่ตรวจแล้วว่าไม่ใช่ปัญหาจริง (ข้ามเฉพาะกฎ + ไฟล์ที่ระบุ ไม่ปิดกฎทั้งโปรเจกต์)
sonar.issue.ignore.multicriteria=demoRandom,demoComplex,scriptPath,testFile

# 1) สคริปต์สร้างยอดขายสาธิต ใช้ Math.random() สุ่มตัวเลขปลอม ไม่เกี่ยวกับความปลอดภัย
sonar.issue.ignore.multicriteria.demoRandom.ruleKey=javascript:S2245
sonar.issue.ignore.multicriteria.demoRandom.resourceKey=backend/scripts/demo-data.js

# 2) สคริปต์สร้างข้อมูลสาธิต (ไม่ใช่โค้ดที่ร้านใช้งาน) วนสร้างบิลหลายแบบในฟังก์ชันเดียวโดยตั้งใจ
sonar.issue.ignore.multicriteria.demoComplex.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.demoComplex.resourceKey=backend/scripts/demo-data.js

# 3) สคริปต์ดูแลระบบ (สำรอง/คืนค่า) เรียกคำสั่ง docker ผ่าน PATH ของเครื่องผู้ดูแล รันในเครื่องเท่านั้น
sonar.issue.ignore.multicriteria.scriptPath.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.scriptPath.resourceKey=backend/scripts/**

# 4) ชุดทดสอบ API (167+ รายการ) เขียนแบบสคริปต์ยิง API จริง ไม่ใช้ test framework
#    SonarQube จึงไม่รู้จักและเตือนว่า "ไม่มีเทส" ซึ่งไม่จริง
sonar.issue.ignore.multicriteria.testFile.ruleKey=javascript:S2187
sonar.issue.ignore.multicriteria.testFile.resourceKey=backend/tests/**
